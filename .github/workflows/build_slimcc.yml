name: Build and Package Portable Slimcc

on:
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make binutils

      - name: Build slimcc
        run: |
          ln -s platform/linux-glibc-generic.c platform.c
          make

      - name: Prepare portable package
        run: |
          # 创建干净的目录结构
          mkdir -p slimcc-portable
          
          # 1. 复制核心可执行文件
          cp slimcc slimcc-portable/
          
          # 2. 复制运行时必需的头文件目录
          cp -r slimcc_headers slimcc-portable/
          
          # 3. 复制说明文档和许可证（方便查阅）
          cp LICENSE README.md slimcc-portable/ 2>/dev/null || true
          
          # 4. 清理可能产生的无用文件
          rm -f slimcc-portable/slimcc_headers/platform_fix/*/*.o 2>/dev/null || true

      - name: Create archive and checksum
        run: |
          tar -czvf slimcc-portable.tar.gz slimcc-portable
          sha256sum slimcc-portable.tar.gz > slimcc-portable.tar.gz.sha256
          echo "===== PACKAGE CONTENT ====="
          find slimcc-portable -type f | sort
          echo "===== ARCHIVE SIZE ====="
          ls -lh slimcc-portable.tar.gz

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: slimcc-portable
          path: |
            slimcc-portable.tar.gz
            slimcc-portable.tar.gz.sha256
          if-no-files-found: error
