name: Build Slimcc

on:
  workflow_dispatch:   # 允许手动点击触发

jobs:
  build:
    runs-on: ubuntu-22.04   # 改用固定版本，避免 ubuntu-latest 排队和迁移问题
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make binutils

      - name: Build slimcc
        run: |
          ln -s platform/linux-glibc-generic.c platform.c
          make

      - name: Show generated files
        run: ls -la   # 打印出当前目录结构，方便你检查

      - name: Upload slimcc build tree
        uses: actions/upload-artifact@v4
        with:
          name: slimcc-build
          path: .   # 打包整个当前目录（包含可执行文件、include头文件、platform等）
          if-no-files-found: error
