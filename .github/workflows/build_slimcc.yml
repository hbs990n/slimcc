name: Analyze Slimcc Structure

on:
  workflow_dispatch:   # 手动触发

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make binutils tree

      - name: Build slimcc
        run: |
          ln -s platform/linux-glibc-generic.c platform.c
          make

      - name: Generate analysis report
        run: |
          echo "===== FILE TREE (with sizes, excluding .git) =====" > analysis_report.txt
          tree -a -h --du -I '.git' >> analysis_report.txt
          
          echo -e "\n===== EXECUTABLE FILES =====" >> analysis_report.txt
          find . -type f -executable -not -path './.git/*' -exec ls -lh {} \; >> analysis_report.txt
          
          echo -e "\n===== INCLUDE DIRECTORY =====" >> analysis_report.txt
          ls -lh include/ >> analysis_report.txt 2>&1 || echo "No include directory found" >> analysis_report.txt
          
          echo -e "\n===== SLIMCC BINARY DETAILS =====" >> analysis_report.txt
          file slimcc >> analysis_report.txt 2>&1 || echo "slimcc not found" >> analysis_report.txt
          ls -lh slimcc >> analysis_report.txt 2>&1 || true
          
          echo "----- REPORT START -----"
          cat analysis_report.txt
          echo "----- REPORT END -----"

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: analysis_report.txt
